name: Lint and Testing

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint @ Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            **/go.sum
            go.tools.sum
      - name: Lint
        run: make lint

  test:
    name: test @ Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            **/go.sum
            go.tools.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: make vet
      - name: Test with race detector and coverage
        run: make test
      - name: Build examples
        run: make build
